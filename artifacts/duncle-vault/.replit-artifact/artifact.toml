kind = "web"
previewPath = "/"
title = "D'Uncle Vault"
version = "1.0.0"
id = "artifacts/duncle-vault"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19251

[services.development]
run = "pnpm --filter @workspace/duncle-vault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/duncle-vault", "run", "build" ]
publicDir = "artifacts/duncle-vault/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19251"
BASE_PATH = "/"
